name: Release Windows

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing version tag, for example v0.0.4"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      RELAY_RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Prepare signed release
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          $relayPackage = Get-Content -LiteralPath package.json -Raw | ConvertFrom-Json
          $relayConfig = Get-Content -LiteralPath src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $relayCargo = Get-Content -LiteralPath Cargo.toml -Raw
          $relayWorkspace = [regex]::Match($relayCargo, '(?s)\[workspace\.package\]\s*version\s*=\s*"([^"]+)"')
          if ($env:RELAY_RELEASE_TAG -ne "v$($relayPackage.version)" -or $relayConfig.version -ne $relayPackage.version -or $relayWorkspace.Groups[1].Value -ne $relayPackage.version) {
            throw "Release tag and app versions must match"
          }
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            throw "Missing TAURI_SIGNING_PRIVATE_KEY repository secret"
          }
          $relayFlags = @(
            "--remap-path-prefix=$env:USERPROFILE=/build/user",
            "--remap-path-prefix=$env:GITHUB_WORKSPACE=/build/agent-relay"
          ) -join [char]0x1f
          "CARGO_ENCODED_RUSTFLAGS=$relayFlags" >> $env:GITHUB_ENV

      - run: npm ci

      - name: Build signed Windows updater
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run bundle -- --bundles nsis -- --locked

      - name: Upload draft release with GitHub CLI
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $relayInstallers = @(Get-ChildItem -LiteralPath target/release/bundle/nsis -Filter '*-setup.exe')
          if ($relayInstallers.Count -ne 1) { throw "Expected one Windows installer" }
          $relayHashes = $relayInstallers | ForEach-Object {
            $relayHash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$relayHash  $($_.Name)"
          }
          Set-Content -LiteralPath target/release/bundle/nsis/SHA256SUMS.txt -Value $relayHashes -Encoding utf8NoBOM
          $relaySignaturePath = "$($relayInstallers[0].FullName).sig"
          $relaySignature = (Get-Content -LiteralPath $relaySignaturePath -Raw).Trim()
          if ([string]::IsNullOrWhiteSpace($relaySignature)) { throw "Missing updater signature" }

          $relayIsDraft = gh release view $env:RELAY_RELEASE_TAG --json isDraft --jq .isDraft
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:RELAY_RELEASE_TAG --title "Relay $env:RELAY_RELEASE_TAG" --draft --verify-tag --generate-notes
            if ($LASTEXITCODE -ne 0) { throw "Failed to create draft release" }
          } elseif ($relayIsDraft -ne "true") {
            throw "Release already published; only draft releases can be updated"
          }

          $relayNotes = gh release view $env:RELAY_RELEASE_TAG --json body --jq .body
          if ($LASTEXITCODE -ne 0) { throw "Failed to read release notes" }
          $relayNotes = $relayNotes -join "`n"
          $relayNotesPath = "docs/releases/$env:RELAY_RELEASE_TAG.md"
          if (Test-Path -LiteralPath $relayNotesPath) {
            $relayNotes = Get-Content -LiteralPath $relayNotesPath -Raw
          }
          $relayReleaseBase = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/releases/download/$env:RELAY_RELEASE_TAG"
          $relayPlatform = @{
            signature = $relaySignature
            url = "$relayReleaseBase/$($relayInstallers[0].Name)"
          }
          $relayManifest = @{
            version = (Get-Content -LiteralPath package.json -Raw | ConvertFrom-Json).version
            notes = $relayNotes
            pub_date = [DateTime]::UtcNow.ToString("o")
            platforms = @{
              "windows-x86_64" = $relayPlatform
              "windows-x86_64-nsis" = $relayPlatform
            }
          }
          $relayManifestPath = "target/release/bundle/nsis/latest.json"
          Set-Content -LiteralPath $relayManifestPath -Value ($relayManifest | ConvertTo-Json -Depth 12) -Encoding utf8NoBOM
          gh release upload $env:RELAY_RELEASE_TAG $relayInstallers[0].FullName $relaySignaturePath $relayManifestPath target/release/bundle/nsis/SHA256SUMS.txt --clobber
          if ($LASTEXITCODE -ne 0) { throw "Failed to upload release assets" }

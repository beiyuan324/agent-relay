name = "agent-relay"
main = "src/index.ts"
compatibility_date = "2025-09-01"
workers_dev = false
preview_urls = false

# 使用当前 Cloudflare 账号托管的自定义域名。
routes = [{ pattern = "relay.example.com", custom_domain = true }]

[durable_objects]
bindings = [{ name = "RELAY_ROOM", class_name = "RelayRoom" }]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RelayRoom"]

[observability]
enabled = false
